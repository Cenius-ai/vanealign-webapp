[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanealign"
version = "1.0.0"
description = "Polar alignment checklist, eyepiece magnification table and seeing-conditions notes for visual astronomers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vanealign = "vanealign:main"

[tool.setuptools]
py-modules = ["vanealign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
